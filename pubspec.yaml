name: glass
description: Allows conversion of any widget to a "glass" or "frosted glass" version of itself
version: 2.2.0
homepage: https://github.com/Zachariah-Abraham/glass
repository: https://github.com/Zachariah-Abraham/glass
issue_tracker: https://github.com/Zachariah-Abraham/glass/issues
topics:
  - glassmorphism
  - blur
  - effects
  - ui
  - widget

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # To add assets to your package, add an assets section, like this:
  assets:
    - images/noise.png
  shaders:
    - shaders/liquid_glass.frag

  #
  # For details regarding assets in packages, see
  # https://flutter.dev/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
