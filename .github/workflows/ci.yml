name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Analyze and test (Flutter ${{ matrix.flutter-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported Flutter (see `environment` in pubspec.yaml) and latest stable.
        flutter-version: ['3.27.0', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version != 'stable' && matrix.flutter-version || '' }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        if: matrix.flutter-version == 'stable'
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test

      - name: Analyze
        run: flutter analyze

      # Goldens are pixel comparisons and only valid on the pinned Flutter version (see `golden` job).
      - name: Test
        run: flutter test --exclude-tags golden

      - name: Analyze example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Validate package for publishing
        if: matrix.flutter-version == 'stable'
        run: flutter pub publish --dry-run

  golden:
    name: Golden tests
    runs-on: ubuntu-latest
    env:
      # Pixel output changes between Flutter releases. Keep this pinned, and when you bump it,
      # regenerate the goldens (AGENTS.md, "Golden tests") and review the images.
      GOLDEN_FLUTTER_VERSION: '3.47.7'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.GOLDEN_FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run golden tests
        run: flutter test --tags golden

      - name: Upload failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/failures/
          if-no-files-found: ignore

  example-build:
    name: Build example (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Platform folders are gitignored, so generate the one we build.
      - name: Build the example app against the package
        working-directory: example
        run: |
          flutter create --platforms=web .
          flutter build web

  integration:
    name: Integration test (Linux desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb

      # Platform folders are gitignored, so generate the one we run on.
      - name: Run the example's integration test on a real engine
        working-directory: example
        run: |
          flutter create --platforms=linux .
          xvfb-run -a flutter test integration_test -d linux
